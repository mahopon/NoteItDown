global:
  scrape_interval: 15s

scrape_configs: # Scrape target for metrics
  - job_name: otel-collector
    static_configs:
      - targets:
          - otel-collector:8889
          - node-exporter:9100

rule_files: # List down alerting rules
  - "alerts.yml"

alerting: # Alerting rule output targets
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093