spring:
  datasource:
    url: jdbc:${POSTGRESQL_CONN_STRING}&prepareThreshold=0
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0