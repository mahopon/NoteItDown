spring:
  output:
    ansi:
      enabled: ALWAYS
  application:
    name: nid
  datasource:
    url: jdbc:${POSTGRESQL_CONN_STRING}&prepareThreshold=0
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0