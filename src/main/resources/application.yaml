spring:
  output:
    ansi:
      enabled: ALWAYS
  application:
    name: nid
  datasource:
    url: jdbc:${POSTGRESQL_CONN_STRING}&prepareThreshold=0
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  session:
    store-type: jdbc
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
#        default-requeue-rejected: false
        concurrency: 2
        max-concurrency: 10
        retry:
          enabled: true
          initial-interval: 1000
          multiplier: 2
          max-interval: 10000
          max-attempts: 5
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

nid:
  mail:
    transport: ${NID_MAIL_TRANSPORT:smtp}
    from: ${NID_MAIL_FROM:noreply@nid.local}
    ses:
      region: ${AWS_REGION:ap-southeast-1}

logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.rabbit: DEBUG
