spring:
  output:
    ansi:
      enabled: ALWAYS
  application:
    name: nid
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: jdbc:${POSTGRESQL_CONN_STRING}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
#        default-requeue-rejected: false
        concurrency: 2
        max-concurrency: 10
        retry:
          enabled: true
          initial-interval: 1000
          multiplier: 2
          max-interval: 10000
          max-attempts: 5
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      base-url: ${OPENAI_BASE_URL:http://localhost:9931}
      chat:
        model: ${LLM_MODEL}

management:
  server:
    port: ${MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

nid:
  mail:
    transport: ${NID_MAIL_TRANSPORT:smtp}
    from: ${NID_MAIL_FROM:noreply@nid.local}
    ses:
      region: ${AWS_REGION:ap-southeast-1}
