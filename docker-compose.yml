services:
  postgres:
    image: postgres:18.6
    container_name: postgres
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: ADMIN
      POSTGRES_PASSWORD: pw123!
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  redis:
    image: redis:8.8.2
    container_name: redis
    ports:
      - "6079:6379"
    volumes:
      - redis_data:/data

  rabbitmq:
    image: rabbitmq:4.1-management
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: nid
      RABBITMQ_DEFAULT_PASS: pw123!
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  kafka:
    image: apache/kafka:3.9.1
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    volumes:
      - kafka_data:/var/lib/kafka/data

  nid-be:
    container_name: nid-be
    build: .
    image: nid-be:latest
    environment:
      SPRING_PROFILES_ACTIVE: dev
      POSTGRESQL_CONN_STRING: postgresql://postgres:5432/postgres?user=ADMIN&password=pw123!
      OTEL_SERVICE_NAME: nid-be
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      S3_ENDPOINT: https://3881fc9113fb78065cd00baeac2920fc.r2.cloudflarestorage.com/
      UPLOAD_IMAGE_BUCKET: nid-uploaded-images
      S3_ACCESS_KEY: cea2d8e9b0cc78a975f7c67a027dad03
      S3_SECRET_KEY: 0ca6c8e3826393011cde16e01a13e37ade97af19d8bf1a98257f17f213643255
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: nid
      RABBITMQ_PASSWORD: pw123!
#      MAIL_HOST: mailpit
#      MAIL_PORT: 1025
#      OPENAI_API_KEY: APIKEY
#      OPENAI_BASE_URL: http://host.internal:9931
#      LLM_MODEL: ornith-ai/Ornith-1.5-35B-A3B-GGUF:Q6_K

    depends_on:
      - otel-collector
      - rabbitmq
      - mailpit
    ports:
      - "8080:8080"
      - "8081:8081" # management/actuator, restrict external access via security group

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.160.0
    container_name: otel-collector
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
      - "8889:8889"

  alertmanager:
    image: prom/alertmanager
    container_name: alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml

  prom:
    container_name: prom
    image: prom/prometheus:v3.13.3
    depends_on:
      - otel-collector
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts.yml:/etc/prometheus/alerts.yml:ro

  ne:
    image: prom/node-exporter:v1.12.1
    container_name: node-exporter
    restart: unless-stopped
    pid: host
    command:
      --path.procfs=/host/proc
      --path.sysfs=/host/sys
      --path.rootfs=/rootfs
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    ports:
      - '9100:9100'

  ministack:
    image: ministackorg/ministack:latest
    container_name: ministack
    ports:
      - "4566:4566"

  mailpit:
    image: axllent/mailpit:latest
    container_name: mailpit
    ports:
      - "8025:8025" # Web UI
      - "1025:1025" # SMTP
    restart: unless-stopped

volumes:
  postgres_data:
  pgadmin_data:
  redis_data:
  rabbitmq_data:
  kafka_data: